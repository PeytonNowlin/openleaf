name: Demo site

# NOTE: this workflow DOES run on push, unlike ci.yml which is manual-only.
#
# That is deliberate rather than an oversight. CI was made manual because
# installing three browser engines took over fifteen minutes per push. This job
# installs no browsers and finishes in well under a minute, and a demo site that
# silently falls behind main is worse than no demo site -- the whole reason it
# exists is to be the current thing people can try.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Actions are pinned to full commit SHAs, not to tags.
#
# A tag is a mutable pointer: whoever controls the action's repository can move
# `v4` to a new commit and every workflow that names the tag runs that commit on
# the next push, with no change to this file and no review. That is the standard
# supply-chain path into a repository, and this workflow is the one where it
# matters most -- it is the only one that fires automatically, and it holds
# `pages: write` and `id-token: write`, so a compromised step can mint an OIDC
# token and replace the published site. `pnpm/action-setup` is third-party.
#
# Each pin carries the version it corresponds to, because a bare SHA is
# unreviewable. Bump both together, and read the diff between the two SHAs.

# Never cancel a deploy in progress: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Build the bundle and copy assets
        # demo/ is published verbatim as the site root, so the page that ships
        # is byte-identical to the one developed against locally.
        run: node demo/build.mjs

      - name: Fail if the bundle is missing
        # An empty or partial deploy would replace a working site with a broken
        # one, and Pages has no automatic rollback.
        run: test -s demo/openleaf.min.js && test -s demo/assets/openleaf-logo.png

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
