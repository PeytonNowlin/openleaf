name: CI

# CI is MANUAL-ONLY while the project is this young.
#
# Nothing here is deleted or weakened -- the jobs below are the real gate and
# still run on demand via `gh workflow run ci.yml` or the Actions tab. They just
# do not fire on every push, because installing three browser engines with
# system dependencies took longer than the entire local suite takes to run, and
# at this stage waiting on a remote runner was costing more than it caught.
#
# The local equivalent is `pnpm verify`, which runs the same four checks.
#
# TO RE-ENABLE on every push, restore:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

# Actions are pinned to full commit SHAs. A tag is a mutable pointer, so naming
# `v4` means running whatever its owner points it at next -- see the longer note
# in pages.yml, which is the workflow where that matters most. The trailing
# comment is the version each SHA corresponds to; bump both together.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r build

      - name: Round-trip fidelity and unit tests
        run: pnpm test

      # Every bundle, not just the core one: the budgets live in
      # scripts/bundle-budgets.mjs so this and `pnpm verify` cannot drift into
      # measuring different files against different numbers.
      - name: Bundle size
        run: node scripts/bundle-budgets.mjs

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        # All three engines. WebKit is not optional -- it is Safari and every
        # iOS browser, and it is historically where selection bugs live.
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Note: only meaningful on pull_request. Under manual dispatch this is
    # skipped, so sign-off is enforced by discipline (`git commit -s`) until
    # push-triggered CI is restored.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        run: |
          # OpenLeaf uses the DCO rather than a CLA -- see GOVERNANCE.md s.2.
          # The DCO is what keeps copyright with each contributor instead of
          # assigning it to a steward, so every signed-off commit from someone
          # new raises the cost of a future relicense. This check is what makes
          # that true one commit at a time, not ceremony.
          missing=0
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line"
              missing=1
            fi
          done
          exit $missing
