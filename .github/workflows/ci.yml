name: CI

# CI runs on every pull request and every push to main.
#
# It did not used to. The whole workflow was `on: workflow_dispatch` -- manual
# only -- because installing three browser engines with system dependencies took
# longer than the entire local suite takes to run. That reasoning was sound about
# the browsers and wrong about everything else: it took the cheap checks offline
# along with the expensive ones, and it made the `dco` job unreachable, since a
# job gated on `github.event_name == 'pull_request'` can never fire under a
# trigger that is only ever `workflow_dispatch`.
#
# So the split is by cost, not by all-or-nothing:
#
#   fast     every PR and every push to main. Chromium only, ~3-4 minutes.
#   dco      every PR. No install, no browsers, seconds.
#   browser  all three engines. Nightly, plus on demand from the Actions tab.
#            WebKit is not optional -- it is Safari and every iOS browser, and
#            it is historically where selection bugs live -- it just does not
#            need to block the pull request that Chromium already covered.
#
# `push` is scoped to main rather than every branch: a branch is gated by its
# pull request, and gating both doubles the runner time for the same commits.
# Nothing reaches main ungated either way.
#
# The jobs shell out to `scripts/verify.mjs` instead of listing steps here. That
# is the point: this file used to carry its own copy of the step list, and the
# two drifted -- CI had a step named "Typecheck" that ran `pnpm -r build`, which
# type checks no test file at all. There is one list now, and `pnpm verify` runs
# it locally.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:17 UTC, off the hour so it is not queued behind everyone else's cron.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Actions are pinned to full commit SHAs. A tag is a mutable pointer, so naming
# `v4` means running whatever its owner points it at next -- see the longer note
# in pages.yml, which is the workflow where that matters most. The trailing
# comment is the version each SHA corresponds to; bump both together.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are wasted minutes; superseded main runs are history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Gate (chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      # The same gate a contributor runs as `pnpm verify:quick`: build,
      # typecheck (src and tests), unit and fidelity tests, chromium e2e, the
      # dist-dependency and schema-singleton guards, SSR imports of every
      # published entry point, and the bundle budgets.
      - name: pnpm verify:quick
        run: node scripts/verify.mjs --quick

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14

  browser:
    name: Gate (chromium, firefox, webkit)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: pnpm verify
        run: node scripts/verify.mjs

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  dco:
    name: Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        env:
          # The PR's real endpoints, NOT `origin/<base>..HEAD`. On a
          # pull_request event, actions/checkout checks out GitHub's synthetic
          # merge commit, so HEAD is a `Merge <head> into <base>` commit that
          # GitHub generates and nobody signs off. Walking back from it fails
          # every pull request ever opened, however disciplined the author.
          #
          # That was the shape this check shipped with. It was invisible for the
          # job's entire life because the job could never run -- the only
          # trigger was workflow_dispatch, under which
          # `if: github.event_name == 'pull_request'` is never true. Both bugs
          # surfaced on the pull request that added `pull_request:` above, which
          # is the argument for the trigger in one line.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # OpenLeaf uses the DCO rather than a CLA -- see GOVERNANCE.md s.2.
          # The DCO is what keeps copyright with each contributor instead of
          # assigning it to a steward, so every signed-off commit from someone
          # new raises the cost of a future relicense. This check is what makes
          # that true one commit at a time, not ceremony.
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line"
              echo "  $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Sign off with 'git commit -s', or 'git rebase --signoff' for existing commits. See CONTRIBUTING.md."
          fi
          exit $missing
