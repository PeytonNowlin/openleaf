<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenLeaf session tools harness</title>
<style>body { font: 16px/1.6 system-ui, sans-serif; margin: 2rem; max-width: 52rem; }</style>
</head>
<body>
<form id="post-form" method="post" action="/submitted">
  <label for="body">Post body</label>
  <openleaf-editor
    for="body"
    aria-label="Post body"
    toolbar="undo redo | bold italic | find wordCount save preview print newDocument | source"></openleaf-editor>
  <textarea id="body" name="body" hidden><p>alpha beta alpha</p>
<p>gamma</p></textarea>
  <button type="submit" id="save">Save</button>
</form>

<script src="/demo/openleaf.min.js"></script>
<script src="/demo/openleaf-session.min.js"></script>
</body>
</html>
