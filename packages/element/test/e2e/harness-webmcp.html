<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenLeaf agent tools harness</title>
<style>body { font: 16px/1.6 system-ui, sans-serif; margin: 2rem; max-width: 52rem; }</style>
</head>
<body>
<!--
  Several editors, deliberately not alike.

  The whole point of a page-global tool set is that a page with more than one
  editor works, so the fixture that proves it has to have more than one. The
  three differ in the ways the tools care about:

    post-body    an explicit id on the host element, which is what an agent
                 is handed and passes back.
    (none)       no id at all, so the register falls back to an ordinal. The
                 documented integrations bind with `for` and give the host no
                 id, so this is the common case, not the exotic one.
    comment-box  a deliberately narrow `toolbar`, so a deployment where most
                 editing commands were never put on the bar is exercised
                 alongside one where they were.

  Host ids are distinct from the textarea ids they bind to (`post-body` for
  `body`), because `getElementById` cannot answer for two elements.
-->
<form id="post-form" method="post" action="/submitted">
  <label for="body">Post body</label>
  <openleaf-editor
    id="post-body"
    for="body"
    aria-label="Post body"
    toolbar="undo redo | bold italic | source"></openleaf-editor>
  <textarea id="body" name="body" hidden><p>alpha beta</p></textarea>

  <label for="notes">Notes</label>
  <openleaf-editor
    for="notes"
    aria-label="Notes"
    toolbar="bold italic | source"></openleaf-editor>
  <textarea id="notes" name="notes" hidden><p>gamma</p></textarea>

  <label for="comment">Comment</label>
  <openleaf-editor
    id="comment-box"
    for="comment"
    aria-label="Comment"
    toolbar="bold italic"></openleaf-editor>
  <textarea id="comment" name="comment" hidden><p>delta</p></textarea>

  <button type="submit" id="save">Save</button>
</form>

<script src="/demo/openleaf.min.js"></script>
<script src="/demo/openleaf-webmcp.min.js"></script>
</body>
</html>
