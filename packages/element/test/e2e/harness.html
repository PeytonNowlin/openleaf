<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Openleaf browser test harness</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 2rem; }
  .openleaf-content { min-height: 8rem; padding: .5rem; border: 1px solid #666; }
  /* ProseMirror marks a selected atom with this class. Preserved blocks can be
     replaced by typing, so the selection must be unmistakable first. */
  .openleaf-content .ProseMirror-selectednode {
    outline: 2px solid Highlight;
    outline-offset: 2px;
    border-radius: 3px;
  }
</style>
</head>
<body>
<!--
  Mirrors the documented CMS integration exactly: a form, a hidden textarea
  carrying the stored HTML, and the element bound to it by id. If this page
  needs anything the README does not tell integrators to do, the test is
  lying about what we ship.
-->
<form id="post-form" method="post" action="/submitted">
  <label for="body">Post body</label>
  <openleaf-editor for="body" aria-label="Post body"></openleaf-editor>
  <textarea id="body" name="body" hidden><h2>Existing heading</h2>
<p>A stored paragraph.</p>
<div class="callout" data-callout-id="7"><p>Load-bearing wrapper.</p></div></textarea>
  <button type="submit" id="save">Save</button>
</form>

<script src="/demo/openleaf.min.js"></script>
</body>
</html>
